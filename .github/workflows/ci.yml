name: Fantasy Edge CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install hosted app dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck hosted app
        run: npm run typecheck
      - name: Build hosted app and extension download
        run: npm run build
